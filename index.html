<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWFITNESS — 25 Week Tracker</title>
<style>
:root{
--black:#0b0a0a;
--charcoal:#161414;
--panel:#1d1a1a;
--line:#332c2c;
--red:#b3121c;
--red-bright:#e81c26;
--paper:#ece7df;
--muted:#8a8078;
--mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
--disp: 'Oswald', 'Arial Narrow', sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;}
body{
margin:0;
background:var(--black);
background-image:
radial-gradient(circle at 15% 0%, rgba(179,18,28,0.10), transparent 40%),
repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 6px);
color:var(--paper);
font-family:var(--mono);
padding:0 0 80px 0;
min-height:100vh;
}
.hero{
border-bottom:3px solid var(--red);
padding:28px 20px 20px;
position:relative;
overflow:hidden;
}
.hero::before{
content:"";
position:absolute; inset:0;
background:linear-gradient(180deg, rgba(179,18,28,0.14), transparent 70%);
pointer-events:none;
}
.logo{
height:clamp(60px,12vw,100px);
width:auto;
display:block;
}
.subhead{
font-size:12px;
letter-spacing:3px;
text-transform:uppercase;
color:var(--muted);
margin-top:6px;
}
.controls{
max-width:1100px;
margin:22px auto 0;
padding:0 20px;
display:flex;
gap:12px;
flex-wrap:wrap;
align-items:flex-end;
position:relative;
}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{
font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
}
select, input[type=text]{
background:var(--panel);
border:1px solid var(--line);
color:var(--paper);
padding:9px 10px;
font-family:var(--mono);
font-size:14px;
border-radius:2px;
outline:none;
}
select:focus, input[type=text]:focus{ border-color:var(--red-bright); }
select{min-width:180px;}
#clientName{min-width:200px;}
button{
font-family:var(--disp);
letter-spacing:1.5px;
text-transform:uppercase;
font-size:13px;
font-weight:600;
padding:10px 16px;
border-radius:2px;
border:1px solid var(--red);
background:transparent;
color:var(--red-bright);
cursor:pointer;
transition:background .15s, color .15s;
}
button:hover{ background:var(--red); color:var(--paper); }
button.primary{ background:var(--red); color:var(--paper); }
button.primary:hover{ background:var(--red-bright); border-color:var(--red-bright); }
button.ghost{ border-color:var(--line); color:var(--muted); }
button.ghost:hover{ background:var(--panel); color:var(--paper); border-color:var(--muted);}
.status{
max-width:1100px;
margin:10px auto 0;
padding:0 20px;
font-size:11px;
color:var(--muted);
letter-spacing:1px;
min-height:14px;
}
.status.saved{ color:#7fbf6a; }
.status.saving{ color:var(--red-bright); }
#app{ max-width:1100px; margin:0 auto; padding:26px 20px; display:none; }
#gate{ max-width:600px; margin:60px auto; padding:0 20px; text-align:center; }
#gate p{ color:var(--muted); font-size:13px; line-height:1.7; }
.block{
background:var(--charcoal);
border:1px solid var(--line);
border-left:4px solid var(--red);
border-radius:3px;
margin-bottom:22px;
overflow:hidden;
}
.block-head{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 18px;
background:var(--panel);
cursor:pointer;
user-select:none;
border-bottom:1px solid var(--line);
}
.block-title{
font-family:var(--disp);
font-weight:600;
letter-spacing:2px;
text-transform:uppercase;
font-size:16px;
color:var(--paper);
display:flex;
align-items:center;
gap:10px;
}
.block-title .num{
color:var(--red-bright);
font-size:22px;
font-weight:700;
}
.block-sub{ font-size:11px; color:var(--muted); letter-spacing:1px; margin-top:2px;}
.chevron{ color:var(--muted); font-size:14px; transition:transform .2s; }
.block.collapsed .chevron{ transform:rotate(-90deg); }
.block-body{ padding:16px 18px 20px; }
.block.collapsed .block-body{ display:none; }
.meta-row{
display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;
}
.meta-row .field{ flex:1; min-width:200px; }
.meta-row input[type=text]{ width:100%; }
table{ width:100%; border-collapse:collapse; }
th, td{ padding:8px 6px; text-align:center; border:1px solid var(--line); }
th{
font-family:var(--disp);
font-size:11px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--muted);
background:rgba(255,255,255,0.02);
font-weight:500;
}
th .wk{ display:block; color:var(--paper); font-size:13px; font-weight:600; }
td.exlabel{
text-align:left;
font-family:var(--disp);
font-size:13px;
letter-spacing:0.5px;
color:var(--paper);
background:rgba(255,255,255,0.02);
white-space:nowrap;
}
td input{
width:100%;
background:var(--black);
border:1px solid var(--line);
color:var(--paper);
text-align:center;
padding:7px 4px;
font-family:var(--mono);
font-size:13px;
border-radius:2px;
outline:none;
}
td input:focus{ border-color:var(--red-bright); background:#140f0f; }
td input::placeholder{ color:#4a4340; }
.abs-note{
font-size:10px;
color:var(--muted);
margin-top:8px;
font-style:italic;
}
footer{
max-width:1100px;
margin:10px auto 0;
padding:0 20px;
text-align:center;
color:var(--muted);
font-size:10px;
letter-spacing:1px;
}
@media (max-width:700px){
table, thead, tbody, th, td, tr{ display:block; }
thead{ display:none; }
tr{ margin-bottom:10px; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
td{ display:flex; justify-content:space-between; align-items:center; border:none; border-bottom:1px solid var(--line); text-align:right; }
td.exlabel{ background:var(--panel); justify-content:flex-start; }
td:before{ content: attr(data-label); font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
td input{ width:100px; }
}
</style>
</head>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw8cjsf9LSTzQWJgfXjiNcaedEajYT_UkdCa9joW9fGRepRAon3cOW3SAGeQVGkxdps/exec";

const REP_SCHEME_A = ["10,10,12","8,8,10","6,6,8","4,4,6","2,2,4"];
const REP_SCHEME_HT = ["3x15","3x12","3x9","3x6","3x3"];

const EXERCISES = [
  { key:"squat", label:"BB Back Squats", type:"weight", schemeArr:REP_SCHEME_A },
  { key:"row", label:"BB Bent Rows", type:"weight", schemeArr:REP_SCHEME_A },
  { key:"ohp", label:"DB O/Head Press", type:"weight", schemeArr:REP_SCHEME_A },
  { key:"hipthrust", label:"SL Hip Thrust", type:"weight", schemeArr:REP_SCHEME_HT },
  { key:"bench", label:"BB Bench Press", type:"weight", schemeArr:REP_SCHEME_A },
  { key:"chin", label:"Chin Ups (max reps)", type:"chin", schemeArr:null },
];

let currentClient = null;
let clientData = null;
let saveTimer = null;
let loadToken = 0; // bumped every time a new client is loaded — invalidates stale saves

function normalizeName(name){
  return name.trim().replace(/\s+/g, ' ').toLowerCase();
}

function blankData(){
  return {
    blocks: [1,2,3,4,5].map(b => ({
      block:b,
      chinLoad:"",
      weeks: [1,2,3,4,5].map(()=>({squat:"",chin:"",hipthrust:"",row:"",ohp:"",bench:""}))
    }))
  };
}

function setStatus(text, cls){
  const el = document.getElementById('statusLine');
  el.textContent = text;
  el.className = 'status' + (cls ? ' '+cls : '');
}

function apiConfigured(){
  return API_URL && API_URL.indexOf('http') === 0;
}

function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), ms || 12000);
  return fetch(url, Object.assign({}, options, {
    signal: controller.signal,
    redirect: 'follow',
    cache: 'no-store'
  })).finally(()=> clearTimeout(timer));
}

let isLoading = false;

async function loadClient(rawName){
  if(isLoading) return;
  if(!apiConfigured()){
    setStatus('App not connected — check API_URL is set.');
    return;
  }
  if(!rawName || !rawName.trim()){ setStatus('Enter a name first.'); return; }

  const displayName = rawName.trim().replace(/\s+/g, ' ');
  const lookupKey = normalizeName(rawName);

  clearTimeout(saveTimer);
  const myToken = ++loadToken;

  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'block';

  isLoading = true;
  currentClient = displayName;
  setStatus('Loading…','saving');

  let json;
  try{
    const res = await fetchWithTimeout(API_URL + '?action=get&name=' + encodeURIComponent(lookupKey), { method:'GET' }, 12000);
    json = await res.json();
  }catch(e){
    if(myToken === loadToken){
      setStatus(e.name === 'AbortError' ? 'Timed out — tap "Open my sheet" again to retry.' : 'Could not reach the server — check your connection and try again.');
    }
    isLoading = false;
    return;
  }

  if(myToken !== loadToken){
    isLoading = false;
    return;
  }

  clientData = (json && json.data) ? json.data : blankData();

  document.getElementById('clientName').value = displayName;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
  setStatus('Loaded '+displayName+'.','saved');
  isLoading = false;
}

function queueSave(){
  setStatus('Saving…','saving');
  clearTimeout(saveTimer);

  const nameSnapshot = currentClient;
  const lookupSnapshot = normalizeName(currentClient);
  const dataSnapshot = JSON.parse(JSON.stringify(clientData));
  const tokenSnapshot = loadToken;

  saveTimer = setTimeout(async ()=>{
    if(tokenSnapshot !== loadToken) return;
    try{
      const res = await fetchWithTimeout(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name: lookupSnapshot, displayName: nameSnapshot, data: dataSnapshot })
      }, 20000);
      const json = await res.json();
      if(tokenSnapshot !== loadToken) return;
      if(json && json.ok){
        setStatus('Saved · '+ new Date().toLocaleTimeString(), 'saved');
      } else {
        setStatus('Save failed — check connection.','saving');
      }
    }catch(e){
      if(tokenSnapshot !== loadToken) return;
      setStatus(e.name === 'AbortError' ? 'Save timed out — check your connection.' : 'Save failed — check connection.','saving');
    }
  }, 500);
}

function weekLabel(blockIdx, weekIdx){
  return (blockIdx*5) + weekIdx + 1;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  clientData.blocks.forEach((block, bIdx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'block';
    wrap.dataset.block = bIdx;

    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML = `
      <div>
        <div class="block-title"><span class="num">${block.block}</span> BLOCK ${block.block}</div>
        <div class="block-sub">WEEKS ${weekLabel(bIdx,0)}–${weekLabel(bIdx,4)}</div>
      </div>
      <div class="chevron">▾</div>`;
    head.addEventListener('click', ()=>{ wrap.classList.toggle('collapsed'); });
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'block-body';

    const meta = document.createElement('div');
    meta.className = 'meta-row';
    meta.innerHTML = `
      <div class="field">
        <label>Chin up load this block</label>
        <input type="text" data-block="${bIdx}" data-field="chinLoad" placeholder="e.g. bodyweight / +10kg / red band" value="${escapeHtml(block.chinLoad)}">
      </div>`;
    body.appendChild(meta);

    meta.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        block[e.target.dataset.field] = e.target.value;
        queueSave();
      });
    });

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    let headRow = '<tr><th style="text-align:left;">Week</th>';
    EXERCISES.forEach(ex=>{
      headRow += `<th>${ex.label}</th>`;
    });
    headRow += '</tr>';
    thead.innerHTML = headRow;
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for(let w=0; w<5; w++){
      const tr = document.createElement('tr');
      let rowHtml = `<td class="exlabel"><span class="wk">WK ${weekLabel(bIdx,w)}</span></td>`;
      EXERCISES.forEach(ex=>{
        const val = block.weeks[w][ex.key] || '';
        if(ex.type === 'chin'){
          rowHtml += `<td data-label="${ex.label}">
            <input type="text" inputmode="numeric" placeholder="reps" data-block="${bIdx}" data-week="${w}" data-key="${ex.key}" value="${escapeHtml(val)}">
          </td>`;
        } else {
          rowHtml += `<td data-label="${ex.label}">
            <input type="text" inputmode="decimal" placeholder="kg" data-block="${bIdx}" data-week="${w}" data-key="${ex.key}" value="${escapeHtml(val)}">
          </td>`;
        }
      });
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    body.appendChild(table);

    const note = document.createElement('div');
    note.className = 'abs-note';
    note.textContent = 'Squats / Rows / OHP: weight logged applies across all sets. Hip thrust: weight per leg.';
    body.appendChild(note);

    body.querySelectorAll('td input[data-week]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const b = +e.target.dataset.block, w = +e.target.dataset.week, k = e.target.dataset.key;
        clientData.blocks[b].weeks[w][k] = e.target.value;
        queueSave();
      });
    });

    wrap.appendChild(body);
    app.appendChild(wrap);
  });
}

function escapeHtml(str){
  return String(str==null ? '' : str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function populateClientDropdown(){
  try{
    const res = await fetch(API_URL + '?action=list');
    const json = await res.json();
    const select = document.getElementById('clientSelect');
    (json.names || []).sort().forEach(n=>{
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      select.appendChild(opt);
    });
  }catch(e){
    // If this fails, the "+ New client" option still works fine.
  }
}
populateClientDropdown();

document.getElementById('clientSelect').addEventListener('change', (e)=>{
  const val = e.target.value;
  const newField = document.getElementById('newNameField');
  const loadBtn = document.getElementById('loadBtn');
  if(val === '__new__'){
    newField.style.display = 'flex';
    loadBtn.style.display = 'inline-block';
    document.getElementById('clientName').focus();
  } else if(val){
    newField.style.display = 'none';
    loadBtn.style.display = 'none';
    loadClient(val);
  }
});

document.getElementById('loadBtn').addEventListener('click', ()=>{
  loadClient(document.getElementById('clientName').value);
});

document.getElementById('clientName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') loadClient(e.target.value);
});
</script>
